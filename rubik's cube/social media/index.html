<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PostBuzz | Connect and Share</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="navbar">
    <div class="container">
      <h1 class="logo">PostBuzz</h1>
      <nav>
        <ul class="nav-links">
          <li><button class="btn" id="login-btn">Login</button></li>
          <li><button class="btn outline" id="signup-btn">Sign Up</button></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Landing Section -->
  <section class="landing">
    <div class="container landing-content">
      <h2>Share your moments with the world ✨</h2>
      <p>Join PostBuzz — the place where your posts make a buzz!</p>
      <div>
        <button class="btn" id="get-started">Get Started</button>
      </div>
    </div>
  </section>

  <!-- Auth Modal -->
  <div id="auth-modal" class="modal hidden">
    <div class="modal-content">
      <span class="close-btn" id="close-modal">&times;</span>

      <div id="login-form" class="form active">
        <h2>Login to PostBuzz</h2>
        <input type="text" placeholder="Username" required />
        <input type="password" placeholder="Password" required />
        <button class="btn form-btn" id="login-submit">Login</button>
        <p>Don’t have an account? <a href="#" id="switch-to-signup">Sign up here</a>.</p>
      </div>

      <div id="signup-form" class="form hidden">
        <h2>Create Account</h2>
        <input type="text" placeholder="Username" required />
        <input type="email" placeholder="Email" required />
        <input type="password" placeholder="Password" required />
        <button class="btn form-btn" id="signup-submit">Sign Up</button>
        <p>Already a member? <a href="#" id="switch-to-login">Login here</a>.</p>
      </div>
    </div>
  </div>

  <!-- Feed Section (visible after login) -->
  <section class="feed hidden" id="feed">
  <div class="container">
    <h2>Welcome back, <span id="user-name">User</span>! 🐝</h2>

    <div class="new-post">
      <textarea placeholder="What's buzzing?" id="post-input"></textarea>
      <button class="btn" id="post-btn">Post</button> <!-- 👈 This is the post button -->
    </div>

    <!-- The videos and posts will appear here -->
    <div id="posts-area" class="posts-area"></div>
  </div>
</section>

  <footer>
    <p>© 2026 PostBuzz. Built with 💛 for community and creativity.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
